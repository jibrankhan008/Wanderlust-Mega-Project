name: ci-cd
on:
  push:
    branches:
      - jibrankhan
  pull_request:
    branches:
      - jibrankhan
jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: |
          cd ./frontend
          npm install
      - name: Start Backend Services
        run: |
          docker compose up -d
          sleep 15
      - name: Run Linter
        run: |
          cd ./frontend
          npm run lint
      - name: Run Unit Tests
        working-directory: frontend
        run: npm test -- --watchAll=false __tests__/App.test.tsx
      - name: Build Docker Image
        run: |
          docker build -t frontend ./frontend

  backend:
      name: backend
      runs-on: ubuntu-latest
      needs: frontend
      steps:
        - name: Code Checkout
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
        - name: Install Dependencies
          run: |
            cd ./backend
            npm install
#        - name: Run Unit Tests
#          run: |
#            cd ./backend
#            npm test
          - name: Run Unit Tests
            working-directory: backend
            run: npx jest tests/unit --runInBand --watchAll=false
        - name: Build Docker Image
          run: |
            docker build -t backend ./backend
            
  deploy:
      name: Deployment Job
      runs-on: ubuntu-latest
      needs: [frontend,backend]

      steps:
        - name: Deployment Status
          run: echo "Deployment Completed Successfully"
